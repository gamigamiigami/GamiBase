name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/portal-site-creation-s2woj3]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Cache-bust JS/CSS references
        run: |
          sed -i "s/data\.js\"/data.js?v=${GITHUB_SHA::8}\"/; s/script\.js\"/script.js?v=${GITHUB_SHA::8}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::8}\"/" index.html
          sed -i "s/style\.css\"/style.css?v=${GITHUB_SHA::8}\"/" tools/sekigae/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
