name: Test Shigodeki app
on:
  push:
    paths:
      - "tools/shigodeki-sensei/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "netlify/**"
      - "netlify.toml"
      - "scripts/**"
      - ".github/workflows/test-shigodeki-app.yml"
  pull_request:
    paths:
      - "tools/shigodeki-sensei/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "netlify/**"
      - "netlify.toml"
      - "scripts/**"
      - ".github/workflows/test-shigodeki-app.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build:netlify
